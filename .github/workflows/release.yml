name: Release

on:
  push:
    tags: ['v*.*.*']

# Least privilege per job rather than repo-wide: only `release` writes the GitHub release,
# only `publish` needs an OIDC token.
permissions: {}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the GitHub release
    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer needs the full history to derive the version from the tag.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release /p:TreatWarningsAsErrors=true

      - name: Test (unit, all target frameworks)
        run: dotnet test --no-build --configuration Release --filter "Category!=Integration"

      - name: Test (integration)
        run: >-
          dotnet test tests/MailVolt.Integration.Tests --no-build
          --configuration Release --framework net10.0 --filter "Category=Integration"

      - name: Pack NuGet packages
        run: |
          dotnet pack --no-build --configuration Release \
            --output ./artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section for $version"
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            ./artifacts/*.nupkg ./artifacts/*.snupkg

  publish:
    runs-on: ubuntu-latest
    needs: release
    # An irreversible push to nuget.org gets a manual gate. Configure the `nuget`
    # environment with a required reviewer in repository settings.
    environment: nuget
    permissions:
      id-token: write # NuGet Trusted Publishing (OIDC)
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts

      - name: NuGet login (Trusted Publishing / OIDC)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ vars.NUGET_USERNAME }}

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
