version: 2
# Dependabot version updates for NuGet packages
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      mailkit:
        patterns:
          - "MailKit"
          - "MimeKit"
      test-dependencies:
        patterns:
          - "xunit*"
          - "AwesomeAssertions"
          - "NSubstitute"
          - "coverlet*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  # Without this the actions in every workflow rot silently — the runner already warns that
  # actions pinned to Node 20 are being forced onto Node 24.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "docker-compose"
    directory: "/examples"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
